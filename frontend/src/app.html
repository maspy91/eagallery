<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// Runs before paint to avoid a flash of the wrong theme.
			// Priority: saved preference -> OS preference -> dark (brand default).
			(function () {
				try {
					// Brand default is dark. A visitor's explicit choice (stored)
					// always wins; first-time visitors get the brand default
					// regardless of OS preference, matching the original design.
					var stored = localStorage.getItem('theme');
					var theme = stored === 'light' ? 'light' : 'dark';
					if (theme === 'dark') document.documentElement.classList.add('dark');
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
