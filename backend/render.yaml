# Render Blueprint -- https://render.com/docs/blueprint-spec
#
# Deploy: push this repo, then in Render dashboard "New +" -> "Blueprint"
# and point it at the repo. Render reads this file and creates the web
# service below. Fields marked `sync: false` are secrets you paste into
# the Render dashboard once (Environment tab) -- they're deliberately not
# in this file so they never end up in git.
#
# Neon (Postgres) and Upstash (Redis) are both external managed services;
# Render doesn't need to provision them, just needs their connection URLs
# as env vars below.

services:
  - type: web
    name: eddyart-gallery-backend
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: "pip install -r requirements.txt"
    # Migrations run before the server starts on every deploy, so a fresh
    # Neon database (or a new migration) is always applied automatically.
    startCommand: "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: APP_NAME
        value: EddyArt Gallery
      - key: DEBUG
        value: "False"
      - key: FRONTEND_URL
        sync: false # e.g. https://your-app.vercel.app
      - key: DATABASE_URL
        sync: false # Neon connection string, postgresql+asyncpg://...?ssl=require
      - key: REDIS_URL
        sync: false # Upstash Redis connection string, rediss://...
      - key: SECRET_KEY
        generateValue: true # Render generates and stores a long random value
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: COOKIE_SAMESITE
        value: none # frontend calls this backend's URL directly (cross-site); use "lax" only if proxying /api/* through a Vercel rewrite instead
      - key: TURNSTILE_ENABLED
        value: "False"
      - key: TURNSTILE_SECRET
        sync: false
      - key: EMAIL_VERIFICATION_TOKEN_TTL_HOURS
        value: "24"
      - key: PASSWORD_RESET_TOKEN_TTL_MINUTES
        value: "30"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        value: noreply@eddyartgallery.app
      - key: SMTP_FROM_NAME
        value: EddyArt Gallery
      - key: SMTP_USE_TLS
        value: "True"
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false # comma-separated: https://your-app.vercel.app,https://your-custom-domain.com
      - key: ADMIN_EMAIL
        sync: false # set on first deploy only, see app/core/bootstrap.py
      - key: ADMIN_PASSWORD
        sync: false
      - key: RATE_LIMIT_LOGIN_MAX_ATTEMPTS
        value: "5"
      - key: RATE_LIMIT_LOGIN_WINDOW_MINUTES
        value: "15"
      - key: RATE_LIMIT_REGISTER_MAX_ATTEMPTS
        value: "5"
      - key: RATE_LIMIT_REGISTER_WINDOW_MINUTES
        value: "60"
